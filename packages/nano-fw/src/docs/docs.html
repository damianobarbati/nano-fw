<!doctype html>
<html>
  <head>
    <title>XYZ API reference</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <div id="scalar-api-reference"></div>
    <script>
    // ref: https://scalar.com/products/api-references/configuration#configuration-options
    const tagOrder = __TAG_ORDER__;
    const logoUrl = __LOGO_URL__;
    const faviconUrl = __FAVICON_URL__;
    const hasErrors = __HAS_ERRORS__;
    const tagPositions = new Map(tagOrder.map((tag, index) => [tag, index]));
    const tagName = (tag) => typeof tag === 'string' ? tag : tag.name;

    const scalarConfig = {
      url: '/docs/openapi.json',
      proxyUrl: 'https://proxy.scalar.com',
      defaultHttpClient: { targetKey: 'shell', clientKey: 'curl' },
      baseServerURL: window.location.href,
      favicon: faviconUrl,
      siteConfig: {
        name: 'XYZ API reference',
      },
      theme: 'default',
      forceDarkModeState: 'light',
      defaultOpenAllTags: true,
      expandAllResponses: true,
      expandAllSchemaProperties: false,
      tagsSorter: 'alpha',
      operationsSorter: 'alpha',
      documentDownloadType: 'none',
      hideClientButton: true,
      hideTestRequestButton: true,
      hideDarkModeToggle: true,
      showDeveloperTools: 'never',
      // https://github.com/scalar/scalar/blob/main/documentation/themes.md#advanced-styling
      withDefaultFonts: true,
      // https://github.com/scalar/scalar/blob/main/documentation/configuration.md#customcss-string
      customCss: `
        .t-doc__sidebar a[href*="scalar.com"][href*="utm_source=powered-by"] { display: none !important; }
        section.introduction-section .section-column:nth-child(2) { display: none !important; }
        section.introduction-section .flex.gap-1\\.5 { display: none !important; }
      `,
    };
    // This remains JavaScript (rather than part of the JSON configuration).
    const tagsSorter = (a, b) => {
      const aName = tagName(a);
      const bName = tagName(b);
      const aPosition = tagPositions.get(aName);
      const bPosition = tagPositions.get(bName);

      if (aName === 'Errors' && bName !== 'Errors') return 1;
      if (bName === 'Errors' && aName !== 'Errors') return -1;
      if (aPosition !== undefined && bPosition !== undefined) return aPosition - bPosition;
      if (aPosition !== undefined) return -1;
      if (bPosition !== undefined) return 1;
      return aName.localeCompare(bName);
    };

    // add logo
    const onSidebarReady = (sidebar) => {
      const img = document.createElement('img');
      img.src = logoUrl;
      img.alt = 'XYZ logo';
      img.dataset.nanoFwLogo = '';
      img.style.padding = '20px';
      sidebar.prepend(img);
    };

    const moveErrorsToEnd = (sidebar) => {
      const section = [...document.querySelectorAll('.tag-section-container')]
        .find((section) => section.querySelector('h2')?.textContent.trim() === 'Errors');
      const errors = section?.closest('[data-testid="lazy-container"]');
      const navigation = sidebar.querySelector('a[href$="#tag/errors"]')?.closest('[data-sidebar-id]');

      if (!errors || !navigation) return false;
      if (errors.parentElement.lastElementChild !== errors) errors.parentElement.append(errors);
      if (navigation.parentElement.lastElementChild !== navigation) navigation.parentElement.append(navigation);
      return true;
    };

    const observer = new MutationObserver((_mutations, observer) => {
      const sidebar = document.querySelector('.t-doc__sidebar');
      if (!sidebar) return;
      if (!sidebar.querySelector('[data-nano-fw-logo]')) onSidebarReady(sidebar);
      if (!hasErrors || moveErrorsToEnd(sidebar)) observer.disconnect();
    });
    observer.observe(document.body, { childList: true, subtree: true });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/scalar-api-reference/1.78.1/standalone.min.js" integrity="sha512-VASTKbF5lb6kKH9MxWAwSPa1O4y3BP7ljULx7AauVpsoZ7LxM/8b3+MI1G/aNrv8QAxuhEInVdD2WlH2l8ST8A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
    Scalar.createApiReference('#scalar-api-reference', { ...scalarConfig, tagsSorter, ...__SCALAR_OPTIONS__ });
    </script>
  </body>
</html>
